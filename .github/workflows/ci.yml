name: Login App - CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Build Docker image
        run: docker build -t login-app .

      - name: Run login tests
        run: |
          chmod +x test_login.sh
          ./test_login.sh

      - name: Deploy application
        run: |
          echo "Deploying login app..."
          docker run -d -p 5000:5000 login-app
          echo "Login app deployed successfully"

      - name: Finish
        run: echo "CI/CD pipeline completed"
