name: Login App - CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show environment
        run: echo "Environment is $APP_ENV"

      - name: Build Docker image
        run: docker build -t login-app .

      - name: Finish
        run: echo "Pipeline finished"
